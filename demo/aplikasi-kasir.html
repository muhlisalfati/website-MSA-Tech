<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kasir Grosir Berkah Jaya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1648b0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sidebar menu | area kerja. Kasir = katalog bergambar + panel keranjang. HP: navigasi bawah + keranjang jadi lembar penuh. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --ink:#122033; --muted:#5b6a80; --line:#d9e1ec; --soft:#e6ecf5;
  --blue:#1648b0; --blue-ink:#ffffff; --blue-soft:#dde7fb; --yellow:#ffc21a; --yellow-ink:#2a1d00; --yellow-soft:#fff3cf; --warn-ink:#8a5d00;
  --red:#cf3428; --red-soft:#fbe1de; --green:#16804b; --green-soft:#dcf2e5;
  --sans:"Lexend","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b111b; --surface:#121b28; --ink:#e4ebf5; --muted:#97a6bb; --line:#243246; --soft:#192436;
  --blue:#78a2ff; --blue-ink:#071430; --blue-soft:#17284a; --yellow:#ffcd3f; --yellow-ink:#2a1d00; --yellow-soft:#3a2f0e; --warn-ink:#ffcd3f;
  --red:#ff7a6e; --red-soft:#3d1916; --green:#4fd08c; --green-soft:#12321f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111b; --surface:#121b28; --ink:#e4ebf5; --muted:#97a6bb; --line:#243246; --soft:#192436;
  --blue:#78a2ff; --blue-ink:#071430; --blue-soft:#17284a; --yellow:#ffcd3f; --yellow-ink:#2a1d00; --yellow-soft:#3a2f0e; --warn-ink:#ffcd3f;
  --red:#ff7a6e; --red-soft:#3d1916; --green:#4fd08c; --green-soft:#12321f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{border:0;border-radius:10px;min-height:44px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn.yellow{background:var(--yellow);color:var(--yellow-ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)} .chip.warn{background:var(--yellow-soft);color:var(--warn-ink)} .chip.bad{background:var(--red-soft);color:var(--red)} .chip.info{background:var(--blue-soft);color:var(--blue)}

/* kerangka */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--blue);color:var(--blue-ink);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px}
.brand .lg{width:42px;height:42px;border-radius:12px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand b{display:block;font-size:15px;line-height:1.15}
.brand small{opacity:.8;font-size:12px}
.nav-btn{border:0;background:transparent;color:inherit;border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:10px;font-weight:500;text-align:left;opacity:.85}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--blue);opacity:1;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;opacity:.85;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.2);display:grid;gap:6px}
.side .foot a{color:var(--yellow);font-weight:600}
.side .foot button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-size:12px;text-align:left}
main{overflow:auto;min-width:0;position:relative}
.mtop,.bnav,.cartbar,.close-cart{display:none}
.view{padding:20px 24px 40px;display:grid;gap:16px;align-content:start}
.vh{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.vh h1{margin:0;font-size:22px}
.vh p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar>*{flex:1;min-width:150px}
.toolbar .btn{flex:none}

/* kasir */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.catalog{overflow:auto;padding:16px 20px 24px;display:grid;gap:12px;align-content:start}
.searchrow{display:flex;gap:8px;position:sticky;top:0;z-index:3;background:var(--bg);padding-block:4px}
.search{position:relative;flex:1}
.search input{padding-left:42px;font-size:16px;min-height:50px;border-radius:12px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cats button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.cats button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;display:grid;gap:4px;text-align:left;position:relative;align-content:start}
.pcard:hover{border-color:var(--blue)}
.pcard:active{transform:scale(.98)}
.pcard:disabled{opacity:.45;cursor:not-allowed}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--soft);display:block;max-width:100%}
.pcard .nm{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pcard .pr{font-weight:800;color:var(--blue);font-size:15px}
.pcard .gr{font-size:11.5px;background:var(--yellow-soft);border-radius:6px;padding:2px 6px;justify-self:start;font-weight:600}
.pcard .stk{font-size:12px;color:var(--muted)}
.pcard .stk.low{color:var(--red);font-weight:600}
.pcard .qb{position:absolute;top:12px;right:12px;background:var(--yellow);color:var(--yellow-ink);border-radius:999px;min-width:28px;height:28px;padding:0 8px;display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:8px}
.cart-h h2{margin:0;font-size:17px}
.lines{flex:1;overflow:auto;padding:4px 16px}
.ln{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.ln img{width:44px;height:44px;border-radius:8px;object-fit:cover;grid-row:span 2}
.ln .nm{font-weight:600;font-size:14px;line-height:1.25}
.ln .sub{font-size:12.5px;color:var(--muted)}
.ln .tot{font-weight:700;text-align:right}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:16px;flex:none}
.qty input{width:56px;min-height:34px;padding:4px;text-align:center;font-weight:700}
.rm{border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 0;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:40px 12px;display:grid;gap:8px;justify-items:center}
.empty svg{width:48px;height:48px;opacity:.5}
.sum{border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.big{font-size:24px;font-weight:800}
.row input{width:130px;text-align:right;min-height:38px;padding:6px 10px}
.paybtn{min-height:56px;font-size:18px;font-weight:800;border-radius:14px}
.hint{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}

/* tabel/daftar */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block}
.pname{font-weight:600}
.code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi b{display:block;font-size:22px;margin-top:4px}
.kpi.hl{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.kpi.hl span{color:var(--blue-ink);opacity:.8}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid var(--line);padding-top:6px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bars i{width:100%;max-width:44px;background:var(--blue-soft);border-radius:6px 6px 0 0;min-height:2px}
.bars div.today i{background:var(--blue)}
.bars small{font-size:11px;color:var(--muted)}
.bars em{font-style:normal;font-size:10.5px;color:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:9px;font-size:14px}
.hb .t{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--yellow)}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
details summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
details[open] summary{margin-bottom:8px}
.diff-pos{color:var(--green);font-weight:700} .diff-neg{color:var(--red);font-weight:700}
.opn input{width:90px;min-height:38px;padding:6px 8px;text-align:right}
.opn tr.changed td{background:var(--yellow-soft)}
.stickybar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 -6px 20px rgba(10,20,40,.08)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select{color:var(--ink);font-weight:400}
.addline{display:grid;grid-template-columns:minmax(0,2fr) 100px 140px auto;gap:8px;align-items:end}
@media (max-width:640px){.addline{grid-template-columns:1fr 1fr}.addline label:first-child{grid-column:1/-1}.addline .btn{grid-column:1/-1}}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(480px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,14,26,.55)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg h2{margin:0;font-size:19px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--soft);width:38px;height:38px;border-radius:10px;font-size:20px;flex:none}
.paytotal{background:var(--blue);color:var(--blue-ink);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline}
.paytotal span{font-size:13px;opacity:.85}
.paytotal b{font-size:30px}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.methods button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;min-height:52px;font-weight:700;font-size:14px}
.methods button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.cashin{font-size:26px;font-weight:800;text-align:right;min-height:58px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:46px;font-weight:700}
.change{display:flex;justify-content:space-between;align-items:baseline;background:var(--green-soft);color:var(--green);border-radius:12px;padding:12px 14px;font-weight:700}
.change b{font-size:26px}
.change.short{background:var(--red-soft);color:var(--red)}
.paper{background:#fffef8;color:#1b1b1b;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:18px 16px;border-radius:6px;border:1px solid #ece6d2;max-height:60vh;overflow:auto}
.paper .c{text-align:center}
.paper hr{border:0;border-top:1px dashed #8e8a7a;margin:8px 0}
.paper .r{display:flex;justify-content:space-between;gap:8px}
.imgpick{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.imgpick img{width:110px;height:110px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.imgpick .acts{display:grid;gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

/* ===== HP & tablet kecil ===== */
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100%}
  .side{display:none}
  .mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--blue);color:var(--blue-ink);padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
  .mtop .brand{padding:0}
  .mtop .brand .lg{width:34px;height:34px;font-size:13px;border-radius:10px}
  .mtop .demo-note{font-size:11px;opacity:.85;text-align:right}
  .mtop .demo-note button{background:none;border:0;color:var(--yellow);padding:0;font-size:11px;font-weight:700}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;min-height:52px}
  .bnav svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--blue)}
  .view{padding:14px max(14px,env(safe-area-inset-right,0px)) 28px max(14px,env(safe-area-inset-left,0px))}
  .pos{grid-template-columns:minmax(0,1fr);height:auto;min-height:100%}
  .catalog{padding:10px max(12px,env(safe-area-inset-right,0px)) 96px max(12px,env(safe-area-inset-left,0px));overflow:visible}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .hint{display:none}
  .cart{position:fixed;inset:0;z-index:50;border-left:0;transform:translateY(100%);transition:transform .25s ease;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
  .cart.open{transform:none;visibility:visible}
  .close-cart{display:inline-flex}
  .cartbar{display:block;position:sticky;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%)}
  .cartbar button{width:100%;min-height:56px;border-radius:14px;justify-content:space-between;padding:0 18px;font-size:16px;box-shadow:0 8px 20px rgba(22,72,176,.3)}
  .methods{grid-template-columns:repeat(2,1fr)}
  .opn td{padding:8px 4px}.opn input{width:68px}
  .opn .pname{font-size:13.5px}
  .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}
</style>

<script>
/* ============ Utilitas ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>new Intl.NumberFormat("id-ID").format(Math.round(n||0));
const rp=n=>(n<0?"-Rp":"Rp")+fmt(Math.abs(n));
const num=v=>parseInt(String(v).replace(/[^\d-]/g,""))||0;
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dkey=d=>{d=new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const today=()=>dkey(new Date());
const tm=d=>new Date(d).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
const dt=d=>new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ICON={

   pouch:`<path d="M30 26l5-6 5 6 5-6 5 6 5-6 5 6 5-6 5 6 5-6 5 6 5-6 5 6v74a6 6 0 01-6 6H36a6 6 0 01-6-6z" fill="${c}"/><g clip-path="url(#k)"><clipPath id="k"><rect x="30" y="20" width="60" height="86"/></clipPath>${band(56)}</g>`,
   pack:`<rect x="14" y="34" width="92" height="56" rx="8" fill="${c}"/><path d="M14 42h92M14 82h92" stroke="rgba(0,0,0,.18)" stroke-dasharray="3 3"/><clipPath id="k"><rect x="14" y="34" width="92" height="56" rx="8"/></clipPath><g clip-path="url(#k)">${band(51)}</g>`,
   tray:`<rect x="14" y="58" width="92" height="34" rx="6" fill="#c9a77a"/>${[0,1,2].map(i=>`<ellipse cx="${32+i*28}" cy="${50}" rx="12" ry="15" fill="${c}"/>`).join("")}${[0,1].map(i=>`<ellipse cx="${46+i*28}" cy="${66}" rx="12" ry="15" fill="${c}" stroke="#fff" stroke-width="1.5"/>`).join("")}<text x="60" y="104" text-anchor="middle" font-family="Arial" font-weight="700" font-size="13" fill="#7a5b30">${l}</text>`,

   box:`<path d="M24 34l36-14 36 14v62l-36 14-36-14z" fill="${c}"/><path d="M24 34l36 14 36-14M60 48v62" stroke="rgba(0,0,0,.2)" fill="none"/><clipPath id="k"><path d="M24 34l36 14 36-14v62l-36 14-36-14z"/></clipPath><g clip-path="url(#k)">${band(62)}</g>`,
   strip:`${[0,1,2,3,4].map(i=>`<rect x="${12+i*20}" y="${30+(i%2)*4}" width="18" height="56" rx="2" fill="${c}" stroke="#fff" stroke-width="1"/>`).join("")}${band(92)}`,

let cat="Semua", q="", cart=[], discount=0, method="Tunai";
function viewKasir(){

       <div class="row"><label for="disc">Diskon (Rp)</label><input id="disc" class="num" inputmode="numeric" value="${discount?fmt(discount):""}" placeholder="0"></div>
       <div class="row big"><span>Total</span><span class="num" id="tot"></span></div>
       <button class="btn primary paybtn" id="payBtn" type="button" disabled>Bayar</button>
     </div>
   </aside></div>`;
  const cats=["Semua",...CATS];
  $("#cats").innerHTML=cats.map(c=>`<button type="button" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");
  $("#q").oninput=e=>{q=e.target.value;renderGrid()};
  $("#q").onkeydown=e=>{if(e.key!=="Enter")return;e.preventDefault();
    const v=q.trim();const byCode=DB.products.find(p=>p.code===v);const list=filtered();
    const p=byCode||(list.length===1?list[0]:null);
    if(p){addToCart(p.id);q="";e.target.value="";renderGrid()}else toast(v?"Barang tidak ditemukan":"Ketik nama atau scan barcode")};
  $("#disc").oninput=e=>{discount=num(e.target.value);const v=e.target.value.replace(/\D/g,"");e.target.value=v?fmt(+v):"";renderTotals()};

  $("#closeCart").onclick=()=>$("#cart").classList.remove("open");

function filtered(){const s=q.toLowerCase().trim();return DB.products.filter(p=>(cat==="Semua"||p.cat===cat)&&(!s||p.name.toLowerCase().includes(s)||p.code.includes(s)))}
function inCart(id){const l=cart.find(c=>c.id===id);return l?l.qty:0}
function renderGrid(){
  const list=filtered();
  $("#grid").innerHTML=list.map(p=>{const n=inCart(p.id);const st=stockState(p);return `
   <button class="pcard" type="button" data-add="${p.id}" ${p.stock<=0?"disabled":""} aria-label="Tambah ${esc(p.name)}">
     ${n?`<span class="qb num">${n}</span>`:""}
     <img src="${imgOf(p)}" alt="" loading="lazy">
     <span class="nm">${esc(p.name)}</span>
     <span class="pr num">${rp(p.ecer)}<span class="muted" style="font-size:12px;font-weight:500"> /${p.unit}</span></span>
     ${p.gmin?`<span class="gr num">Grosir ≥${p.gmin}: ${rp(p.grosir)}</span>`:""}
     <span class="stk num ${st!=="ok"?"low":""}">${p.stock<=0?"Stok habis":"Stok "+fmt(p.stock)}</span>
   </button>`}).join("")||`<div class="empty" style="grid-column:1/-1">Barang tidak ditemukan. Coba kata lain atau pilih kategori "Semua".</div>`;
}
function addToCart(id,n=1){const p=prod(id);const l=cart.find(c=>c.id===id);const cur=l?l.qty:0;
  if(cur+n>p.stock){toast(`Stok ${p.name} tinggal ${fmt(p.stock)} ${p.unit}`);return}
  if(l)l.qty+=n;else cart.push({id,qty:n});
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  renderCart();
}
function setQty(id,qty){const p=prod(id);const l=cart.find(c=>c.id===id);if(!l)return;
  if(qty>p.stock){toast(`Stok ${p.name} tinggal ${fmt(p.stock)} ${p.unit}`);qty=p.stock}
  if(qty<=0)cart=cart.filter(c=>c!==l);else l.qty=qty;renderGrid();renderCart()}
function cartTotals(){let sub=0,normal=0;cart.forEach(l=>{const p=prod(l.id);sub+=priceFor(p,l.qty)*l.qty;normal+=p.ecer*l.qty});
  const d=Math.min(discount,sub);return{sub,saved:normal-sub,d,total:sub-d,items:cart.reduce((a,l)=>a+l.qty,0)}}
function renderCart(){
  if(!$("#lines"))return;
  $("#lines").innerHTML=cart.length?cart.map(l=>{const p=prod(l.id);const pr=priceFor(p,l.qty);const isG=pr!==p.ecer;return `
   <div class="ln"><img src="${imgOf(p)}" alt="">
     <div><div class="nm">${esc(p.name)}</div><div class="sub num">${rp(pr)} / ${p.unit} ${isG?'<span class="chip warn">harga grosir</span>':p.gmin&&l.qty<p.gmin?`<span class="muted">· grosir mulai ${p.gmin}</span>`:""}</div></div>
     <div class="tot num">${rp(pr*l.qty)}</div>
     <div class="qty" style="grid-column:2"><button type="button" data-q="${p.id}" data-d="-1" aria-label="Kurangi">−</button><input class="num" data-qi="${p.id}" inputmode="numeric" value="${l.qty}" aria-label="Jumlah ${esc(p.name)}"><button type="button" data-q="${p.id}" data-d="1" aria-label="Tambah">+</button></div>
     <div style="text-align:right"><button class="rm" type="button" data-rm="${p.id}">Hapus</button></div>
   </div>`}).join(""):`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${ICON.kasir}</svg><b>Keranjang masih kosong</b><span>Ketuk gambar barang atau scan barcode untuk menambahkan.</span></div>`;
  renderTotals();
}
function renderTotals(){
  const t=cartTotals();
  $("#cnt").textContent=t.items?`· ${fmt(t.items)} barang`:"";
  $("#sub").textContent=rp(t.sub);$("#tot").textContent=rp(t.total);
  $("#saveRow").hidden=!t.saved;$("#saved").textContent=rp(t.saved);
  $("#payBtn").disabled=!cart.length;$("#payBtn").textContent=cart.length?`Bayar ${rp(t.total)}`:"Bayar";
  $("#openCart").innerHTML=cart.length?`<span>${fmt(t.items)} barang · Lihat keranjang</span><b class="num">${rp(t.total)}</b>`:`<span>Keranjang masih kosong</span><span class="num">Rp0</span>`;
}

let cash=0, customer="";
function openPay(){if(!cart.length)return;method="Tunai";cash=0;customer="";renderPay();$("#payDlg").showModal();const c=$("#cashIn");c&&c.focus()}
function renderPay(){
  const t=cartTotals();const chg=cash-t.total;
  const quick=[t.total,Math.ceil(t.total/10000)*10000,Math.ceil(t.total/50000)*50000,Math.ceil(t.total/100000)*100000,Math.ceil(t.total/100000)*100000+100000].filter((v,i,a)=>a.indexOf(v)===i).slice(0,6);
  const ok=method==="Tunai"?cash>=t.total:method==="Kasbon"?customer.trim().length>1:true;
  $("#payDlg").innerHTML=`<div class="dlg">
   <div class="dlg-h"><h2>Pembayaran</h2><button class="x" type="button" data-close aria-label="Tutup">×</button></div>

   method==="Kasbon"?`<label class="f" for="custIn">Nama pelanggan (wajib untuk kasbon)<input id="custIn" value="${esc(customer)}" placeholder="Contoh: Warung Mak Ijah"></label><p class="muted" style="margin:0;font-size:13px">Kasbon tercatat di Laporan dan bisa ditandai lunas saat dibayar.</p>`:

  const ci=$("#cashIn");if(ci){ci.oninput=e=>{cash=num(e.target.value);const v=e.target.value.replace(/\D/g,"");e.target.value=v?fmt(+v):"";

$("#payDlg").addEventListener("click",e=>{

function finishPay(){
  const t=cartTotals();const now=new Date();
  const lines=cart.map(l=>{const p=prod(l.id);return{id:p.id,name:p.name,unit:p.unit,qty:l.qty,price:priceFor(p,l.qty),buy:p.buy}});
  const paid=method==="Tunai"?cash:t.total;
  const tx={no:"BJ"+dkey(now).replace(/-/g,"").slice(2)+"-"+String(DB.seq++).padStart(4,"0"),time:now.toISOString(),lines,subtotal:t.sub,discount:t.d,total:t.total,method,paid,change:paid-t.total,customer:method==="Kasbon"?customer.trim():"",settled:method!=="Kasbon"};
  lines.forEach(l=>prod(l.id).stock-=l.qty);
  DB.tx.push(tx);save();cart=[];discount=0;
  $("#payDlg").close();$("#cart").classList.remove("open");viewKasir();showReceipt(tx);
}

function receiptText(t){const L=[];const w=32;const lr=(a,b)=>a+" ".repeat(Math.max(1,w-a.length-b.length))+b;

     <input id="oNote" value="${esc(op.note)}" placeholder="Catatan (opsional)" aria-label="Catatan" style="width:200px">
     <button class="btn" type="button" id="oReset">Kosongkan</button><button class="btn primary" type="button" id="oSave">Simpan opname</button></div></div>
   <div class="card"><h2>Riwayat opname</h2>${DB.opnames.slice().sort((a,b)=>b.time.localeCompare(a.time)).map(o=>{const ch=o.items.filter(i=>i.fis!==i.sys);const val=o.items.reduce((s,i)=>s+(i.fis-i.sys)*i.buy,0);return `
     <details><summary><span>${o.no} · ${esc(o.note||"Stok opname")}</span><span class="muted num" style="font-weight:500">${dt(o.time)} · ${esc(o.officer)} · ${o.items.length} dicek · ${ch.length} selisih · <span class="${val<0?"diff-neg":val>0?"diff-pos":""}">${rp(val)}</span></span></summary>
     ${o.items.map(i=>{const d=i.fis-i.sys;return `<div class="list-item" style="font-size:14px"><span>${esc(i.name)}</span><span class="num">${fmt(i.sys)} → ${fmt(i.fis)} <span class="${d<0?"diff-neg":d>0?"diff-pos":"muted"}">(${d>0?"+":""}${fmt(d)})</span></span></div>`}).join("")}</details>`}).join("")||'<p class="muted">Belum ada riwayat.</p>'}</div></div>`;
  $("#oq").oninput=e=>{op.q=e.target.value;renderOT()};$("#ocat").onchange=e=>{op.cat=e.target.value;renderOT()};
  $("#oOff").oninput=e=>op.officer=e.target.value;$("#oNote").oninput=e=>op.note=e.target.value;
  $("#oReset").onclick=()=>{op.fis={};renderOT()};
  $("#oSave").onclick=()=>{const ids=Object.keys(op.fis).filter(k=>op.fis[k]!=="");if(!ids.length)return toast("Isi stok fisik minimal satu barang");if(!op.officer.trim())return toast("Isi nama petugas");
    const items=ids.map(id=>{const p=prod(id);const fis=num(op.fis[id]);const it={id,name:p.name,unit:p.unit,sys:p.stock,fis,buy:p.buy};p.stock=fis;return it});
    DB.opnames.push({no:"SO-"+String(DB.oseq++).padStart(4,"0"),time:new Date().toISOString(),officer:op.officer.trim(),note:op.note.trim(),items});save();
    const ch=items.filter(i=>i.fis!==i.sys).length;op.fis={};op.note="";toast(`Opname tersimpan · ${items.length} dicek, ${ch} disesuaikan`);viewOpname()};
  renderOT();
}
function renderOT(){const s=op.q.toLowerCase();
  $("#otb").innerHTML=DB.products.filter(p=>(op.cat==="Semua"||p.cat===op.cat)&&p.name.toLowerCase().includes(s)).map(p=>{const v=op.fis[p.id]??"";const d=v===""?null:num(v)-p.stock;return `
   <tr class="${d!==null&&d!==0?"changed":""}"><td style="width:52px" class="hide-m"><img class="thumb" src="${imgOf(p)}" alt=""></td><td><div class="pname">${esc(p.name)}</div><div class="muted" style="font-size:12px">${p.cat} · ${p.unit}</div></td>
   <td class="r num">${fmt(p.stock)}</td><td class="r"><input class="num" data-fis="${p.id}" inputmode="numeric" value="${v}" placeholder="—" aria-label="Stok fisik ${esc(p.name)}"></td>
   <td class="r num" data-d="${p.id}">${d===null?'<span class="muted">—</span>':`<span class="${d<0?"diff-neg":d>0?"diff-pos":"muted"}">${d>0?"+":""}${fmt(d)}</span>`}</td>
   <td class="r num hide-m" data-v="${p.id}">${d?rp(d*p.buy):"—"}</td></tr>`}).join("")||'<tr><td colspan="6" class="muted" style="padding:16px">Tidak ada barang.</td></tr>';
  renderOSum();
}
function renderOSum(){const ids=Object.keys(op.fis).filter(k=>op.fis[k]!=="");let plus=0,minus=0,val=0;ids.forEach(id=>{const p=prod(id);const d=num(op.fis[id])-p.stock;if(d>0)plus+=d;else minus+=d;val+=d*p.buy});
  $("#osum").innerHTML=ids.length?`<b>${ids.length}</b> barang dicek · <span class="diff-pos">+${fmt(plus)}</span> / <span class="diff-neg">${fmt(minus)}</span> · nilai <b class="${val<0?"diff-neg":val>0?"diff-pos":""}">${rp(val)}</b>`:`<span class="muted">Belum ada barang yang dihitung</span>`}
document.addEventListener("input",e=>{const f=e.target.closest("[data-fis]");if(!f)return;const id=f.dataset.fis;const v=f.value.replace(/\D/g,"");f.value=v;op.fis[id]=v;
  const p=prod(id);const d=v===""?null:+v-p.stock;const tr=f.closest("tr");tr.className=d!==null&&d!==0?"changed":"";
  tr.querySelector("[data-d]").innerHTML=d===null?'<span class="muted">—</span>':`<span class="${d<0?"diff-neg":d>0?"diff-pos":"muted"}">${d>0?"+":""}${fmt(d)}</span>`;
  const vc=tr.querySelector("[data-v]");if(vc)vc.textContent=d?rp(d*p.buy):"—";renderOSum()});
document.addEventListener("keydown",e=>{const f=e.target.closest&&e.target.closest("[data-fis]");if(f&&e.key==="Enter"){e.preventDefault();const all=$$("[data-fis]");const i=all.indexOf(f);if(all[i+1])all[i+1].focus()}});

/* ============ LAPORAN ============ */
let repDate="";
function viewLaporan(){
  if(!repDate)repDate=today();
  const tx=DB.tx.filter(t=>dkey(t.time)===repDate);
  const omzet=tx.reduce((s,t)=>s+t.total,0);
  const cost=tx.reduce((s,t)=>s+t.lines.reduce((a,l)=>a+l.qty*l.buy,0),0);
  const items=tx.reduce((s,t)=>s+t.lines.reduce((a,l)=>a+l.qty,0),0);
  const debts=DB.tx.filter(t=>t.method==="Kasbon"&&!t.settled);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(repDate+"T12:00");d.setDate(d.getDate()-6+i);const k=dkey(d);return{k,d,v:DB.tx.filter(t=>dkey(t.time)===k).reduce((s,t)=>s+t.total,0)}});
  const mx=Math.max(1,...days.map(d=>d.v));
  const by={};tx.forEach(t=>t.lines.forEach(l=>{by[l.name]=by[l.name]||{q:0,u:l.unit,v:0};by[l.name].q+=l.qty;by[l.name].v+=l.qty*l.price}));
  const top=Object.entries(by).sort((a,b)=>b[1].v-a[1].v).slice(0,6);const tm2=top[0]?top[0][1].v:1;
  const low=DB.products.filter(p=>p.stock<=p.min).sort((a,b)=>a.stock/a.min-b.stock/b.min);
  const byM={};tx.forEach(t=>byM[t.method]=(byM[t.method]||0)+t.total);
  $("#main").innerHTML=`<div class="view">
   <div class="vh"><div><h1>Laporan</h1><p>${new Date(repDate+"T12:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p></div><input type="date" id="rDate" value="${repDate}" aria-label="Tanggal laporan" style="width:auto"></div>
   <div class="kpis">
     <div class="kpi hl"><span>Omzet</span><b class="num">${rp(omzet)}</b></div>
     <div class="kpi"><span>Laba kotor</span><b class="num" style="color:var(--green)">${rp(omzet-cost)}</b><div class="muted" style="font-size:12px">Margin ${omzet?((omzet-cost)/omzet*100).toFixed(1):0}%</div></div>
     <div class="kpi"><span>Transaksi</span><b class="num">${tx.length}</b><div class="muted" style="font-size:12px">${fmt(items)} barang terjual</div></div>
     <div class="kpi"><span>Kasbon belum lunas</span><b class="num" style="color:var(--red)">${rp(debts.reduce((s,t)=>s+t.total,0))}</b><div class="muted" style="font-size:12px">${debts.length} nota</div></div>
   </div>
   <div class="two">
     <div class="card"><h2>Omzet 7 hari</h2><div class="bars">${days.map(d=>`<div class="${d.k===repDate?"today":""}" title="${rp(d.v)}"><em class="num">${d.v?(d.v/1e6).toFixed(1)+" jt":""}</em><i style="height:${d.v/mx*85}%"></i><small>${d.d.toLocaleDateString("id-ID",{weekday:"short"})}</small></div>`).join("")}</div>
       <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px">${["Tunai","QRIS","Transfer","Kasbon"].map(m=>`<span>${m}: <b class="num">${rp(byM[m]||0)}</b></span>`).join("")}</div></div>
     <div class="card"><h2>Barang terlaris</h2>${top.map(([n,o])=>`<div class="hb"><span>${esc(n)} <span class="muted num">· ${fmt(o.q)} ${o.u}</span></span><b class="num">${rp(o.v)}</b><div class="t"><i style="width:${o.v/tm2*100}%"></i></div></div>`).join("")||'<p class="muted">Belum ada penjualan di tanggal ini.</p>'}</div>
   </div>
   <div class="two">
     <div class="card"><h2>Stok perlu dibelanjakan <span class="chip bad">${low.length}</span></h2>${low.map(p=>`<div class="list-item"><span style="display:flex;gap:10px;align-items:center"><img class="thumb" src="${imgOf(p)}" alt="" style="width:36px;height:36px"><span>${esc(p.name)}<br><span class="muted" style="font-size:12px">min ${p.min} ${p.unit}</span></span></span><span class="chip ${stockState(p)} num">${p.stock<=0?"Habis":fmt(p.stock)+" "+p.unit}</span></div>`).join("")||'<p class="muted">Semua stok aman.</p>'}
       ${low.length?`<button class="btn yellow" type="button" data-view="masuk" style="margin-top:12px;width:100%">Catat barang masuk</button>`:""}</div>
     <div class="card"><h2>Kasbon pelanggan</h2>${debts.map(t=>`<div class="list-item"><span><b>${esc(t.customer)}</b><br><span class="muted num" style="font-size:12px">${t.no} · ${dt(t.time)}</span></span><span style="display:flex;gap:8px;align-items:center"><b class="num">${rp(t.total)}</b><button class="btn sm" type="button" data-settle="${t.no}">Lunas</button></span></div>`).join("")||'<p class="muted">Tidak ada kasbon yang belum lunas.</p>'}</div>
   </div>
   <div class="card"><h2>Riwayat transaksi <span class="muted" style="font-weight:400;font-size:13px">· klik untuk lihat struk</span></h2><div class="tw"><table><thead><tr><th>No. nota</th><th>Jam</th><th class="hide-m">Barang</th><th>Metode</th><th class="r">Total</th></tr></thead>
     <tbody>${tx.slice().reverse().map(t=>`<tr class="click" data-rcp="${t.no}" tabindex="0"><td class="code" style="font-size:13px;color:var(--ink)">${t.no}</td><td class="num">${tm(t.time)}</td><td class="num hide-m">${t.lines.reduce((a,l)=>a+l.qty,0)}</td><td><span class="chip ${t.method==="Kasbon"?(t.settled?"ok":"bad"):"info"}">${t.method}${t.method==="Kasbon"&&t.settled?" · lunas":""}</span></td><td class="r num"><b>${rp(t.total)}</b></td></tr>`).join("")||'<tr><td colspan="5" class="muted" style="padding:16px 8px">Belum ada transaksi di tanggal ini.</td></tr>'}</tbody></table></div></div></div>`;
  $("#rDate").onchange=e=>{repDate=e.target.value||today();viewLaporan()};
}

/* ============ Event global ============ */
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");if(v){go(v.dataset.view);return}
  const c=e.target.closest("[data-cat]");if(c){cat=c.dataset.cat;$$("[data-cat]").forEach(b=>b.setAttribute("aria-pressed",b===c));renderGrid();return}
  const a=e.target.closest("[data-add]");if(a){addToCart(a.dataset.add);renderGrid();return}
  const qb=e.target.closest("[data-q]");if(qb){setQty(qb.dataset.q,inCart(qb.dataset.q)+ +qb.dataset.d);return}
  const rm=e.target.closest("[data-rm]");if(rm){setQty(rm.dataset.rm,0);return}
  const ed=e.target.closest("[data-edit]");if(ed){openProd(ed.dataset.edit);return}
  const r=e.target.closest("[data-rcp]");if(r){showReceipt(DB.tx.find(t=>t.no===r.dataset.rcp));return}
  const s=e.target.closest("[data-settle]");if(s){const t=DB.tx.find(x=>x.no===s.dataset.settle);t.settled=true;save();toast(`Kasbon ${t.customer} lunas`);viewLaporan();return}
});
document.addEventListener("change",e=>{const qi=e.target.closest("[data-qi]");if(qi)setQty(qi.dataset.qi,num(qi.value))});
document.addEventListener("keydown",e=>{
  const row=e.target.closest&&e.target.closest("tr[data-edit],tr[data-rcp]");if(row&&(e.key==="Enter"||e.key===" ")){e.preventDefault();row.click();return}
  if(view!=="kasir"||document.querySelector("dialog[open]"))return;
  if(e.key==="F2"){e.preventDefault();$("#q").focus();$("#q").select()}
  if(e.key==="F9"){e.preventDefault();openPay()}
});
let armed=false;
$$(".resetBtn").forEach(b=>b.onclick=()=>{if(!armed){armed=true;$$(".resetBtn").forEach(x=>x.textContent="Klik lagi untuk reset");setTimeout(()=>{armed=false;$$(".resetBtn").forEach(x=>x.textContent="Reset data contoh")},3000);return}
  Store.clear();DB=seed();cart=[];bm={supplier:"",invoice:"",date:"",lines:[]};op.fis={};armed=false;$$(".resetBtn").forEach(x=>x.textContent="Reset data contoh");toast("Data contoh dikembalikan");go(view)});
go("kasir");
</script>

</html>
